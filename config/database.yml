default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  username: postgres
  password: postgres

development:
  <<: *default
  database: kilifi_gateway_api_development

test:
  <<: *default
  database: kilifi_gateway_api_test

production:
  <<: *default
  database: kilifi_gateway_api_production
  username: kilifi_gateway_api
  password: <%= ENV['KILIFI_GATEWAY_API_DATABASE_PASSWORD'] %>
